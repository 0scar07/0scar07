name: Tarjetas del perfil

# Genera las tarjetas de estadísticas dentro del propio repositorio (como la serpiente),
# así no dependen de servidores gratuitos de terceros que se caen o se desactivan.
on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
